version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: finova-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "@Utkarsh1201"
      MYSQL_DATABASE: finova_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=@Utkarsh1201"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: finova-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml_service:
    build: ./ml_service
    container_name: finova-ml-fraud-service
    restart: always
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    container_name: finova-spring-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/finova_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "@Utkarsh1201"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FINOVA_FRAUD_SERVICE_URL: http://ml_service:8000/api/v1/fraud/assess
      SERVER_PORT: 8080
    depends_on:
      mysqldb:
        condition: service_healthy
      ml_service:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: finova-react-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
