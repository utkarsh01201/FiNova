server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: finova-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finova_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:@Utkarsh1201}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: FinovaHikariCP
      connection-timeout: 30000
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

finova:
  jwt:
    secret: ${JWT_SECRET:9a2f8c4e7b1d3f6a8e0c2b5d7e9f1a3c5e7b9d1f3a5c7e9b2d4f6a8c0e2b4d6}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  fraud-service:
    url: ${FINOVA_FRAUD_SERVICE_URL:http://localhost:8000/api/v1/fraud/assess}

logging:
  level:
    root: INFO
    com.finova: INFO
